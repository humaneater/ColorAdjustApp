<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>RUNNING</title>
    <style>
      #report {
        position: fixed;
        z-index: 999;
        inset: auto 0 0 0;
        max-height: 42vh;
        margin: 0;
        padding: 8px;
        overflow: auto;
        color: #9cf7c0;
        background: rgba(0, 0, 0, 0.92);
        font: 11px/1.45 Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <script>
      /*
       * 浏览器端冒烟测试：把 index.html 的界面注入本页，按真实脚本顺序加载
       * white-balance.js 与 app.js，然后逐个切换白平衡方式，读取 WebGL 结果像素做断言。
       * 用法：先运行 serve.ps1，再用无头浏览器打开 /tools/browser-check.html
       */
      "use strict";

      /*
       * 无头浏览器不会持续产生合成帧，requestAnimationFrame 只会触发几次，
       * 而 app.js 用 rAF 安排渲染。这里把它替换成等价的定时器实现，
       * 让被测代码在无头环境下也能正常刷新（WebGL 渲染本身仍然是真实的）。
       */
      window.requestAnimationFrame = (callback) =>
        window.setTimeout(() => callback(performance.now()), 16);
      window.cancelAnimationFrame = (handle) => window.clearTimeout(handle);

      /*
       * ?gl=1 屏蔽 WebGL2，用来验证 GLSL ES 1.00 的回退着色器路径
       * （app.js 对普通图片支持 WebGL1 回退）。
       */
      const forceWebgl1 = new URLSearchParams(window.location.search).get("gl") === "1";

      if (forceWebgl1) {
        const originalGetContext = HTMLCanvasElement.prototype.getContext;

        HTMLCanvasElement.prototype.getContext = function (type, ...rest) {
          if (type === "webgl2") {
            return null;
          }

          return originalGetContext.call(this, type, ...rest);
        };
      }

      const results = [];
      const errors = [];

      window.addEventListener("error", (event) => {
        errors.push(String(event.message));
      });
      window.addEventListener("unhandledrejection", (event) => {
        errors.push("unhandledrejection: " + String(event.reason));
      });

      function check(name, condition, detail) {
        results.push({
          name,
          ok: Boolean(condition),
          detail: detail === undefined ? "" : String(detail),
        });
      }

      function near(actual, expected, tolerance) {
        return Math.abs(actual - expected) <= tolerance;
      }

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function frames(count) {
        for (let index = 0; index < count; index += 1) {
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }

        await sleep(40);
      }

      async function waitFor(predicate, label, attempts = 300) {
        for (let index = 0; index < attempts; index += 1) {
          if (predicate()) {
            return true;
          }

          await sleep(30);
        }

        check("等待条件：" + label, false, "超时");
        return false;
      }

      function loadScript(source) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");

          script.src = source;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error("无法加载 " + source));
          document.head.append(script);
        });
      }

      /** 造一张「中性灰阶梯 + 色块 + 灰卡」且整体偏暖的测试图。 */
      function buildTestImage() {
        const canvas = document.createElement("canvas");

        canvas.width = 320;
        canvas.height = 200;
        const context = canvas.getContext("2d");
        const cast = [1.15, 0.98, 0.7];
        const apply = (r, g, b) =>
          `rgb(${Math.round(r * cast[0])},${Math.round(g * cast[1])},${Math.round(b * cast[2])})`;
        const steps = [24, 50, 76, 102, 128, 154, 180, 206];

        steps.forEach((value, index) => {
          context.fillStyle = apply(value, value, value);
          context.fillRect(index * 40, 0, 40, 120);
        });

        context.fillStyle = apply(200, 60, 60);
        context.fillRect(0, 120, 80, 80);
        context.fillStyle = apply(60, 190, 80);
        context.fillRect(80, 120, 80, 80);
        context.fillStyle = apply(70, 90, 200);
        context.fillRect(160, 120, 80, 80);
        // 灰卡：灰点拾色会点在这里
        context.fillStyle = apply(180, 180, 180);
        context.fillRect(240, 120, 80, 80);

        return canvas;
      }

      /** 读出画布上某块区域的平均 RGB（0-255）。 */
      function readRegion(canvas, x, y, width, height) {
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const data = context.getImageData(x, y, width, height).data;
        const sums = [0, 0, 0];
        const count = width * height;

        for (let index = 0; index < count; index += 1) {
          sums[0] += data[index * 4];
          sums[1] += data[index * 4 + 1];
          sums[2] += data[index * 4 + 2];
        }

        return sums.map((value) => value / count);
      }

      function readWhole(canvas) {
        return readRegion(canvas, 0, 0, canvas.width, canvas.height);
      }

      function setSelect(id, value) {
        const select = document.querySelector("#" + id);

        select.value = value;
        select.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function setSlider(id, value) {
        const input = document.querySelector("#" + id);

        input.value = String(value);
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function clickCanvasPixel(canvas, x, y) {
        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
        const offsetX = (rect.width - canvas.width * scale) / 2;
        const offsetY = (rect.height - canvas.height * scale) / 2;

        canvas.dispatchEvent(
          new MouseEvent("click", {
            bubbles: true,
            clientX: rect.left + offsetX + (x + 0.5) * scale,
            clientY: rect.top + offsetY + (y + 0.5) * scale,
          }),
        );
      }

      function visibleRows() {
        return Array.from(document.querySelectorAll("[data-key][data-wb-mode]"))
          .filter((row) => !row.hidden)
          .map((row) => row.dataset.key);
      }

      /* ------------------------- 曲线辅助函数 ------------------------- */

      const CURVE_PAD = 10;

      /** 曲线归一化坐标 → 画布上的客户端坐标（与 app.js 的映射保持一致）。 */
      function curveClientPoint(x, y) {
        const canvas = document.querySelector("#curveCanvas");
        const rect = canvas.getBoundingClientRect();
        const size = canvas.clientWidth || rect.width;
        const plot = size - CURVE_PAD * 2;

        return {
          clientX: rect.left + canvas.clientLeft + CURVE_PAD + x * plot,
          clientY: rect.top + canvas.clientTop + CURVE_PAD + (1 - y) * plot,
        };
      }

      function dispatchCurveDoubleClick(point) {
        document
          .querySelector("#curveCanvas")
          .dispatchEvent(new MouseEvent("dblclick", { bubbles: true, ...point }));
      }

      function dispatchCurveDrag(from, to) {
        const canvas = document.querySelector("#curveCanvas");
        const base = {
          bubbles: true,
          pointerId: 1,
          pointerType: "mouse",
          isPrimary: true,
        };

        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...base, ...from, buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointermove", { ...base, ...to, buttons: 1 }));
        canvas.dispatchEvent(new PointerEvent("pointerup", { ...base, ...to, buttons: 0 }));
      }

      function dispatchCurveKey(key) {
        window.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));
      }

      /* ---------------------- 数字输入框与面板缩放 ---------------------- */

      /** 在数字框里键入数值，模拟真实输入（input + change + 失焦）。 */
      function typeNumber(id, text) {
        const field = document.querySelector(`#${id}`);

        field.focus();
        field.value = String(text);
        field.dispatchEvent(new Event("input", { bubbles: true }));
        field.dispatchEvent(new Event("change", { bubbles: true }));
        field.blur();
      }

      function controlsHeight() {
        return Math.round(
          document.querySelector(".controls").getBoundingClientRect().height,
        );
      }

      function toggleSwitch(id, checked) {
        const input = document.querySelector(`#${id}`);

        input.checked = checked;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function splitterDragTo(clientY) {
        const splitter = document.querySelector("#panelSplitter");
        const rect = splitter.getBoundingClientRect();
        const base = {
          bubbles: true,
          pointerId: 3,
          pointerType: "mouse",
          isPrimary: true,
        };

        splitter.dispatchEvent(
          new PointerEvent("pointerdown", {
            ...base,
            buttons: 1,
            clientX: rect.left + rect.width / 2,
            clientY: rect.top + 4,
          }),
        );
        splitter.dispatchEvent(
          new PointerEvent("pointermove", {
            ...base,
            buttons: 1,
            clientX: rect.left + rect.width / 2,
            clientY,
          }),
        );
        splitter.dispatchEvent(
          new PointerEvent("pointerup", {
            ...base,
            buttons: 0,
            clientX: rect.left + rect.width / 2,
            clientY,
          }),
        );
      }

      /** 统计曲线画布上非背景色的像素数，用来判断是否真的画了东西。 */
      function countCurveInk() {
        const canvas = document.querySelector("#curveCanvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
        let ink = 0;

        for (let index = 0; index < data.length; index += 4) {
          if (data[index] > 24 || data[index + 1] > 26 || data[index + 2] > 30) {
            ink += 1;
          }
        }

        return ink;
      }

      /* ------------------------ 色调分离辅助函数 ------------------------ */

      function regionPixels(canvas, x, y, width, height) {
        const context = canvas.getContext("2d", { willReadFrequently: true });

        return context.getImageData(x, y, width, height).data;
      }

      /** 一块区域里有多少种不同的亮度值。 */
      function distinctLuma(canvas, x, y, width, height) {
        const data = regionPixels(canvas, x, y, width, height);
        const values = new Set();

        for (let index = 0; index < data.length; index += 4) {
          values.add(
            Math.round(
              0.2126 * data[index] + 0.7152 * data[index + 1] + 0.0722 * data[index + 2],
            ),
          );
        }

        return values.size;
      }

      /** 一块区域里某个通道有多少种不同的取值。 */
      function distinctChannel(canvas, x, y, width, height, channel) {
        const data = regionPixels(canvas, x, y, width, height);
        const values = new Set();

        for (let index = channel; index < data.length; index += 4) {
          values.add(data[index]);
        }

        return values.size;
      }

      function countPosterizeInk() {
        const canvas = document.querySelector("#posterizePreview");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
        let ink = 0;

        for (let index = 0; index < data.length; index += 4) {
          if (data[index] > 24 || data[index + 1] > 26 || data[index + 2] > 30) {
            ink += 1;
          }
        }

        return ink;
      }

      function readoutText() {
        return document.querySelector("#whiteBalanceModeValue").value;
      }

      /* ------------------------ 旋转与裁切辅助函数 ------------------------ */

      function canvasSize(canvas) {
        return { width: canvas.width, height: canvas.height };
      }

      function clickButton(id) {
        document.querySelector("#" + id).click();
      }

      /** 某块区域的平均 alpha（0-255），用来判断旋转后的空白角。 */
      function regionAlpha(canvas, x, y, width, height) {
        const data = regionPixels(canvas, x, y, width, height);
        let sum = 0;

        for (let index = 3; index < data.length; index += 4) {
          sum += data[index];
        }

        return sum / (data.length / 4);
      }

      /** 裁切框内部 0-1 位置 → 客户端坐标。 */
      function cropBoxClientPoint(u, v) {
        const rect = document.querySelector("#cropBox").getBoundingClientRect();

        return {
          x: rect.left + rect.width * u,
          y: rect.top + rect.height * v,
        };
      }

      /** 在指定元素上模拟一次裁切拖动（target 决定是移动、缩放还是重画）。 */
      function dispatchCropDrag(target, from, to) {
        const base = {
          bubbles: true,
          pointerId: 7,
          pointerType: "mouse",
          isPrimary: true,
        };

        target.dispatchEvent(
          new PointerEvent("pointerdown", {
            ...base,
            buttons: 1,
            clientX: from.x,
            clientY: from.y,
          }),
        );
        target.dispatchEvent(
          new PointerEvent("pointermove", {
            ...base,
            buttons: 1,
            clientX: to.x,
            clientY: to.y,
          }),
        );
        target.dispatchEvent(
          new PointerEvent("pointerup", {
            ...base,
            buttons: 0,
            clientX: to.x,
            clientY: to.y,
          }),
        );
      }

      function rotationAngleValue() {
        return Number(document.querySelector("#rotationAngle").value);
      }

      function setRotationAngle(value) {
        typeNumber("rotationAngleNumber", value);
      }

      /**
       * 点击「导出图片」，截下真正交给编码器的导出画布。
       * 直接拦 canvas.toBlob，避免在无头环境里解析下载的 blob。
       */
      async function captureExport() {
        const captured = [];
        const originalToBlob = HTMLCanvasElement.prototype.toBlob;
        const exportButton = document.querySelector("#exportButton");

        HTMLCanvasElement.prototype.toBlob = function patched(
          callback,
          type,
          quality,
        ) {
          captured.push({ canvas: this, type });

          return originalToBlob.call(this, callback, type, quality);
        };

        try {
          clickButton("exportButton");
          await waitFor(() => captured.length > 0, "导出画布", 200);
          await waitFor(() => !exportButton.disabled, "导出完成", 200);
        } finally {
          HTMLCanvasElement.prototype.toBlob = originalToBlob;
        }

        if (captured.length === 0) {
          return null;
        }

        const { canvas, type } = captured[0];

        return {
          canvas,
          type,
          width: canvas.width,
          height: canvas.height,
        };
      }

      async function run() {
        const source = await (await fetch("../index.html")).text();
        const parsed = new DOMParser().parseFromString(source, "text/html");

        for (const link of parsed.head.querySelectorAll('link[rel="stylesheet"]')) {
          const stylesheet = document.createElement("link");
          const href = link.getAttribute("href") || "";

          stylesheet.rel = "stylesheet";
          // 本页在 tools/ 子目录下，样式表路径需要回到上一级
          stylesheet.href = href.startsWith("http") ? href : "../" + href.replace(/^\.\//, "");
          document.head.append(stylesheet);
        }

        document.body.insertAdjacentHTML("beforeend", parsed.body.innerHTML);
        await loadScript("../white-balance.js");
        await loadScript("../geometry.js");
        await loadScript("../curves.js");
        await loadScript("../posterize.js");
        await loadScript("../app.js");

        check("白平衡模块已载入", Boolean(window.ColorWhiteBalance));
        check("旋转裁切模块已载入", Boolean(window.ColorGeometry));
        check("曲线模块已载入", Boolean(window.ColorCurves));
        check("色调分离模块已载入", Boolean(window.ColorPosterize));
        check(
          forceWebgl1
            ? "已屏蔽 WebGL2（本次运行验证 WebGL1 回退着色器）"
            : "使用 WebGL2 渲染",
          forceWebgl1
            ? document.createElement("canvas").getContext("webgl2") === null
            : Boolean(document.createElement("canvas").getContext("webgl2")),
        );

        // 注入测试图片
        const imageCanvas = buildTestImage();
        const blob = await new Promise((resolve) =>
          imageCanvas.toBlob(resolve, "image/png"),
        );
        const file = new File([blob], "wb-smoke.png", { type: "image/png" });
        const transfer = new DataTransfer();

        transfer.items.add(file);
        const fileInput = document.querySelector("#fileInput");

        fileInput.files = transfer.files;
        fileInput.dispatchEvent(new Event("change", { bubbles: true }));

        const ready = await waitFor(() => {
          const canvas = document.querySelector("#processedCanvas");

          return (
            !document.querySelector("#controlsFieldset").disabled &&
            canvas.width > 0 &&
            canvas.height > 0
          );
        }, "测试图片加载");

        if (!ready) {
          return;
        }

        // ?shot=<方式>：只加载界面和图片，停在指定白平衡方式，方便截图查看外观
        const shotMode = new URLSearchParams(window.location.search).get("shot");

        if (shotMode) {
          document.querySelector("#report").hidden = true;

          const wbModes = ["manual", "kelvin", "preset", "auto", "grayPoint", "gains", "off"];

          setSelect("whiteBalanceMode", wbModes.includes(shotMode) ? shotMode : "manual");

          if (shotMode === "preset") {
            setSelect("wbPreset", "cloudy");
          }

          if (shotMode === "grayPoint") {
            clickCanvasPixel(document.querySelector("#originalCanvas"), 280, 160);
          }

          if (shotMode === "curve") {
            document.querySelector("#curveButton").click();
            await frames(4);
            dispatchCurveDoubleClick(curveClientPoint(0.25, 0.14));
            await frames(3);
            dispatchCurveDoubleClick(curveClientPoint(0.75, 0.88));
            await frames(4);
          }

          if (shotMode === "posterize") {
            document.querySelector("#posterizeButton").click();
            await frames(4);
            setSlider("posterizeLevels", 5);
            await frames(4);
          }

          if (shotMode === "switches") {
            document.querySelector("#posterizeButton").click();
            await frames(4);
            setSlider("posterizeLevels", 6);
            await frames(3);
            document.querySelector("#closePosterizeDialogButton").click();
            await frames(3);
            document.querySelector("#curveButton").click();
            await frames(4);
            dispatchCurveDoubleClick(curveClientPoint(0.25, 0.16));
            await frames(3);
            dispatchCurveDoubleClick(curveClientPoint(0.75, 0.86));
            await frames(4);
            document.querySelector("#closeCurveDialogButton").click();
            await frames(3);
          }

          if (shotMode === "crop") {
            // 拉直 + 裁切：工具条与裁切框同时出现在图片框上
            setRotationAngle(-6.5);
            await frames(5);
            clickButton("cropButton");
            await frames(5);
            setSelect("cropAspect", "1:1");
            await frames(5);
            dispatchCropDrag(
              document.querySelector("#cropBox"),
              cropBoxClientPoint(0.5, 0.5),
              cropBoxClientPoint(0.62, 0.58),
            );
            await frames(5);
          }

          if (shotMode === "straighten") {
            // 拉直 + 自动去掉空白角：旋转后画面不再有透明边角
            setRotationAngle(8);
            await frames(5);
            clickButton("cropButton");
            await frames(4);
            clickButton("cropAutoButton");
            await frames(4);
            clickButton("cropApplyButton");
            await frames(6);
          }

          await frames(4);
          document.title = "SHOT-READY";
          return;
        }

        const originalCanvas = document.querySelector("#originalCanvas");
        const processedCanvas = document.querySelector("#processedCanvas");
        const sourceMean = readWhole(originalCanvas);
        const sourceWarmth = sourceMean[0] - sourceMean[2];
        // 上半部分是中性灰阶梯，是判断「色偏是否被消除」最可靠的区域
        const sourceGrayStrip = readRegion(originalCanvas, 0, 0, 320, 120);

        check(
          "测试图本身带暖色偏（R 明显高于 B）",
          sourceWarmth > 20,
          `R-B=${sourceWarmth.toFixed(1)}`,
        );
        check(
          "测试图的灰阶区域整体偏暖",
          sourceGrayStrip[0] - sourceGrayStrip[2] > 30,
          `灰阶 R-B=${(sourceGrayStrip[0] - sourceGrayStrip[2]).toFixed(1)}`,
        );

        // 1. 关闭白平衡时结果应与原图一致
        setSelect("whiteBalanceMode", "off");
        await frames(3);
        const offMean = readWhole(processedCanvas);

        check(
          "关闭白平衡时画面等于原图",
          offMean.every((value, index) => near(value, sourceMean[index], 3)),
          `处理=${offMean.map((v) => v.toFixed(1)).join("/")} 原图=${sourceMean
            .map((v) => v.toFixed(1))
            .join("/")}`,
        );
        check("关闭时下拉菜单输出为「关闭」", readoutText() === "关闭", readoutText());
        check(
          "关闭时隐藏全部白平衡参数行",
          visibleRows().length === 0,
          visibleRows().join(","),
        );

        // 2. 手动双轴模式：暖冷滑条应当有效，且切到其它方式后不再叠加
        setSelect("whiteBalanceMode", "manual");
        setSlider("temperature", 80);
        await frames(3);
        const manualWarm = readWhole(processedCanvas);

        check(
          "手动双轴 +80 让画面明显变暖",
          manualWarm[0] - manualWarm[2] > sourceWarmth + 20,
          `R-B=${(manualWarm[0] - manualWarm[2]).toFixed(1)}`,
        );
        check(
          "手动模式显示色温与白平衡两行",
          visibleRows().sort().join(",") === "temperature,whiteBalance",
          visibleRows().join(","),
        );

        setSelect("whiteBalanceMode", "off");
        await frames(3);
        const offAgain = readWhole(processedCanvas);

        check(
          "切到关闭后手动滑条的贡献被完全撤掉",
          offAgain.every((value, index) => near(value, sourceMean[index], 3)),
          `处理=${offAgain.map((v) => v.toFixed(1)).join("/")}`,
        );
        setSlider("temperature", 0);

        // 3. 开尔文色温 + 色调
        setSelect("whiteBalanceMode", "kelvin");
        setSlider("wbKelvin", 9000);
        await frames(3);
        const warm = readWhole(processedCanvas);

        setSlider("wbKelvin", 4000);
        await frames(3);
        const cool = readWhole(processedCanvas);

        check(
          "色温 9000K 比 4000K 更暖",
          warm[0] - warm[2] > cool[0] - cool[2] + 25,
          `9000K R-B=${(warm[0] - warm[2]).toFixed(1)}，4000K R-B=${(
            cool[0] - cool[2]
          ).toFixed(1)}`,
        );
        check(
          "色温模式显示色温 K 与色调两行",
          visibleRows().sort().join(",") === "wbKelvin,wbTint",
          visibleRows().join(","),
        );
        check(
          "色温读数跟随滑条",
          readoutText() === "4000K",
          readoutText(),
        );

        setSlider("wbTint", 80);
        await frames(3);
        const magenta = readWhole(processedCanvas);

        check(
          "色调 +80 让画面偏品红（绿色分量下降）",
          magenta[1] < cool[1] - 2,
          `G ${cool[1].toFixed(1)} → ${magenta[1].toFixed(1)}`,
        );
        setSlider("wbTint", 0);

        // 4. 场景预设

        dispatchCropDrag(
          document.querySelector('.crop-handle[data-handle="se"]'),
          { x: handleRect.left + 4, y: handleRect.top + 4 },
          { x: handleRect.left - 40, y: handleRect.top - 40 },
        );
        await frames(4);

        const resizedBox = document
          .querySelector("#cropBox")
          .getBoundingClientRect();

        check(
          "拖动角手柄可以改小裁切框",
          resizedBox.width < afterDrag.width - 10 &&
            Math.abs(resizedBox.width - resizedBox.height) < 4,
          `${afterDrag.width.toFixed(1)} → ${resizedBox.width.toFixed(1)}`,
        );

        clickButton("cropApplyButton");
        await frames(6);

        const squareSize = canvasSize(processedCanvas);

        check(
          "应用 1:1 裁切后输出是正方形",
          Math.abs(squareSize.width - squareSize.height) <= 1,
          `${squareSize.width}×${squareSize.height}`,
        );

        const cropExport = await captureExport();

        check(
          "裁切后的导出尺寸等于裁切框的像素尺寸",
          cropExport &&
            cropExport.width === squareSize.width &&
            cropExport.height === squareSize.height,
          cropExport
            ? `导出 ${cropExport.width}×${cropExport.height}，预览 ${squareSize.width}×${squareSize.height}`
            : "没有拿到导出文件",
        );

        // 在裁切框外按下并拖动，可以重新拉一个新框
        clickButton("cropButton");
        await frames(5);
        setSelect("cropAspect", "free");
        await frames(4);

        const startBox = document
          .querySelector("#cropBox")
          .getBoundingClientRect();

        dispatchCropDrag(
          document.querySelector("#cropOverlay"),
          {
            x: startBox.left + startBox.width * 0.25,
            y: startBox.top + startBox.height * 0.25,
          },
          {
            x: startBox.left + startBox.width * 0.75,
            y: startBox.top + startBox.height * 0.75,
          },
        );
        await frames(5);

        const redrawnBox = document
          .querySelector("#cropBox")
          .getBoundingClientRect();

        check(
          "在框外拖动可以重新拉一个裁切框",
          Math.abs(redrawnBox.width - startBox.width / 2) < 6 &&
            Math.abs(redrawnBox.height - startBox.height / 2) < 6,
          `${startBox.width.toFixed(0)}×${startBox.height.toFixed(0)} → ${redrawnBox.width.toFixed(0)}×${redrawnBox.height.toFixed(0)}`,
        );

        clickButton("cropCancelButton");
        await frames(5);

        // 取消裁切：回到进入裁切模式前的裁切框
        clickButton("cropButton");
        await frames(5);
        clickButton("cropCancelButton");
        await frames(6);

        check(
          "取消裁切后回到原来的裁切尺寸",
          canvasSize(processedCanvas).width === squareSize.width,
          `${canvasSize(processedCanvas).width}×${canvasSize(processedCanvas).height}`,
        );

        // 还原：旋转、翻转、裁切一起清掉
        clickButton("resetGeometryButton");
        await frames(6);

        check(
          "还原后画布回到原始尺寸",
          canvasSize(processedCanvas).width === baseSize.width &&
            canvasSize(processedCanvas).height === baseSize.height,
          `${canvasSize(processedCanvas).width}×${canvasSize(processedCanvas).height}`,
        );
        check(
          "还原后画面等于原图",
          readWhole(processedCanvas).every((value, index) =>
            near(value, baseMean[index], 2),
          ),
          readWhole(processedCanvas).map((value) => value.toFixed(1)).join("/"),
        );
        check(
          "还原后读数回到未调整",
          document.querySelector("#geometryReadout").textContent === "未调整",
          document.querySelector("#geometryReadout").textContent,
        );

        // 拖动参数面板改变预览区高度后，裁切框要重新贴合画面
        clickButton("cropButton");
        await frames(5);
        splitterDragTo(window.innerHeight - 150);
        await frames(6);

        const boxRect = document
          .querySelector("#cropBox")
          .getBoundingClientRect();
        const canvasRect = processedCanvas.getBoundingClientRect();
        const boxCenter = {
          x: boxRect.left + boxRect.width / 2,
          y: boxRect.top + boxRect.height / 2,
        };
        const canvasCenter = {
          x: canvasRect.left + canvasRect.width / 2,
          y: canvasRect.top + canvasRect.height / 2,
        };

        check(
          "拖动参数面板后裁切框仍然贴合画面",
          Math.abs(boxCenter.x - canvasCenter.x) < 2 &&
            Math.abs(boxCenter.y - canvasCenter.y) < 2,
          `裁切框中心 ${boxCenter.x.toFixed(0)},${boxCenter.y.toFixed(0)}，画面中心 ${canvasCenter.x.toFixed(0)},${canvasCenter.y.toFixed(0)}`,
        );

        document
          .querySelector("#panelSplitter")
          .dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
        await frames(4);
        clickButton("cropCancelButton");
        await frames(5);

        // 旋转之后灰点拾色依然有效：灰卡转到左下角后仍然是中性灰
        setSelect("whiteBalanceMode", "grayPoint");
        await frames(4);
        clickCanvasPixel(processedCanvas, 280, 160);
        await frames(5);
        clickButton("rotateRightButton");
        await frames(7);

        const rotatedCard = readRegion(processedCanvas, 0, 250, 70, 60);
        const cardCast = Math.abs(rotatedCard[0] - rotatedCard[1]) +
          Math.abs(rotatedCard[1] - rotatedCard[2]);

        check(
          "旋转 90° 后灰点仍然参与白平衡（灰卡仍为中性）",
          cardCast < 12,
          `灰卡 R/G/B=${rotatedCard.map((value) => value.toFixed(1)).join("/")}`,
        );
        check(
          "旋转后灰点标记仍然显示在画面上",
          Array.from(document.querySelectorAll(".neutral-picker-mark")).some(
            (marker) => !marker.hidden && marker.style.left !== "",
          ),
          Array.from(document.querySelectorAll(".neutral-picker-mark"))
            .map((marker) => `${marker.hidden ? "hidden" : marker.style.left}`)
            .join(" | "),
        );

        clickButton("resetGeometryButton");
        setSelect("whiteBalanceMode", "off");
        await frames(5);
      }

      run()
        .catch((error) => {
          check("测试脚本执行完成", false, error && error.stack ? error.stack : String(error));
        })
        .finally(() => {
          check(
            "页面没有未捕获的脚本错误",
            errors.length === 0,
            errors.join(" | "),
          );

          const failed = results.filter((item) => !item.ok);
          const lines = results.map(
            (item) => `${item.ok ? "PASS" : "FAIL"} ${item.name}${item.detail ? " :: " + item.detail : ""}`,
          );
          const toast = document.querySelector("#toast");

          lines.push(
            "TOAST " +
              (toast ? JSON.stringify(toast.textContent) : "(none)") +
              " isError=" +
              (toast ? toast.classList.contains("is-error") : "-"),
          );

          document.title = `RESULT ${results.length - failed.length}/${results.length}`;
          document.querySelector("#report").textContent =
            lines.join("\n") + "\n--\n" + document.title;
        });
    </script>
  </body>
</html>
